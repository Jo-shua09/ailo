[project]
name = "ailo-agent"
version = "0.0.0"
description = "Ailo buyer agent, MCP tools and eval harness"
requires-python = ">=3.11"
dependencies = [
  "pyjwt[crypto]>=2.15",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
