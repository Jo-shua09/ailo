<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inside one payment</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1000px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Ailo · living doc, will change</p>
    <h1>Inside one payment: what Ailo checks before money moves</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="payment-check-title payment-check-desc">
        <title id="payment-check-title">Inside one Ailo payment</title>
        <desc id="payment-check-desc">After the agent signature is verified (a bad signature is rejected with 401 and never becomes a payment), Spec Gate rules allow, ask for a Nod or block; funds are reserved; Second Look reviews flagged payments and can only escalate or block; the owner gives a Nod when needed; then Kora pays the account from the payee list and a Receipt is written.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn first) -->
        <line x1="300" y1="96" x2="300" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="380" y1="160" x2="560" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="196" x2="300" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="284" x2="300" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 390,340 H 622 Q 630,340 630,332 V 178" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="300" y1="364" x2="300" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="380" y1="432" x2="540" y2="432" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="664" y1="408" x2="664" y2="178" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 630,456 V 532 Q 630,540 622,540 H 390" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="300" y1="468" x2="300" y2="516" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <line x1="300" y1="564" x2="300" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="444" y="140" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="468" y="150" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BLOCK</text>
        <rect x="308" y="210" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="346" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALLOW / NOD</text>
        <rect x="476" y="320" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="498" y="330" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BLOCK</text>
        <rect x="436" y="412" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="454" y="422" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="672" y="280" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="692" y="290" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DENY</text>
        <rect x="638" y="488" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="668" y="498" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">APPROVE</text>
        <rect x="308" y="486" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="322" y="496" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Start -->
        <rect x="210" y="60" width="180" height="36" rx="18" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="82" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verified pay request</text>

        <!-- Annotation: signature failures never reach this flow -->
        <text x="404" y="84" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">Bad signature: 401, no payment is created</text>

        <!-- Decision: Spec Gate rules -->
        <polygon points="300,124 380,160 300,196 220,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="158" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spec Gate rules</text>
        <text x="300" y="171" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">allow · nod · block</text>

        <!-- Reserve -->
        <rect x="210" y="236" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="258" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reserve funds</text>
        <text x="300" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">hold · available ≥ 0</text>

        <!-- Second Look (optional) -->
        <rect x="210" y="316" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="300" y="338" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Second Look</text>
        <text x="300" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AI · only if flagged · 2s</text>

        <!-- Decision: Needs Nod -->
        <polygon points="300,396 380,432 300,468 220,432" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="430" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Needs a Nod?</text>
        <text x="300" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">rule or AI flag</text>

        <!-- Kora payout (focal) -->
        <rect x="210" y="516" width="180" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="300" y="538" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kora payout</text>
        <text x="300" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">payee-list account · re-check</text>

        <!-- End: Receipt -->
        <rect x="210" y="600" width="180" height="36" rx="18" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="622" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receipt written</text>

        <!-- End: Blocked -->
        <rect x="560" y="142" width="140" height="36" rx="18" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="630" y="164" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blocked + Receipt</text>

        <!-- Owner's Nod -->
        <rect x="540" y="408" width="180" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="630" y="430" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Owner's Nod</text>
        <text x="630" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">phone · one-time approval</text>

        <!-- Legend -->
        <line x1="40" y1="664" x2="760" y2="664" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="692" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="60" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>
        <rect x="104" y="692" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="124" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Only if flagged</text>
        <rect x="216" y="692" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="236" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Money moves</text>
        <line x1="320" y1="698" x2="348" y2="698" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="356" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Owner path</text>
        <text x="440" y="700" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">AI can only escalate or block. Never approves.</text>
      </svg>
    </div>
  </div>
</body>
</html>
