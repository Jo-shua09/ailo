<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ailo screen flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Screen flow · Ailo console + phone · living doc, will change</p>
    <h1>How the owner moves through Ailo</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="screen-flow-title screen-flow-desc">
        <title id="screen-flow-title">Ailo screen flow</title>
        <desc id="screen-flow-desc">The owner signs in with a PIN (sign-in screen not built yet), adds an agent on /agents and sets a rule on /rules, then lives on /dashboard, opening Receipts on /transactions, approving Nods on the phone at /nod, braking an agent or squaring up on /ledger.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="24" y="40" width="652" height="400" rx="8" fill="none" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="40" y="60" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">CONSOLE · LAPTOP</text>
        <rect x="704" y="40" width="232" height="400" rx="8" fill="none" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="720" y="60" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">PHONE</text>

        <!-- Arrows (drawn first) -->
        <!-- Sign in -> Agents -->
        <line x1="104" y1="132" x2="104" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Agents -> Rules -->
        <line x1="104" y1="244" x2="104" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Rules -> Live feed (focal: first-run lands here) -->
        <path d="M 184,332 H 260 Q 268,332 268,324 V 252" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Live feed -> Receipt -->
        <line x1="388" y1="212" x2="460" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Live feed -> Square Up -->
        <path d="M 332,252 V 380 Q 332,388 340,388 H 460" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Receipt -> Brake (agent panel) -->
        <line x1="580" y1="212" x2="604" y2="212" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Live feed -> Nod (push to phone) -->
        <path d="M 300,172 V 108 Q 300,100 308,100 H 740" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Nod -> back to Live feed -->
        <path d="M 820,124 V 268 Q 820,276 812,276 H 380 Q 372,276 372,268 V 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="112" y="158" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="138" y="168" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FIRST RUN</text>
        <rect x="112" y="270" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="146" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">BADGE ISSUED</text>
        <rect x="196" y="312" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="218" y="322" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SAVE</text>
        <rect x="400" y="192" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="424" y="202" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ROW</text>
        <rect x="364" y="368" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="396" y="378" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">END OF DAY</text>
        <rect x="560" y="80" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="604" y="90" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NEEDS NOD</text>
        <rect x="560" y="256" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="604" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ROW UPDATES</text>

        <!-- Nodes -->
        <rect x="40" y="84" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="104" y="106" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sign in</text>
        <text x="104" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PIN · to build</text>

        <rect x="40" y="196" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="104" y="218" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agents</text>
        <text x="104" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/agents · Badge</text>

        <rect x="40" y="308" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="112" y="330" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rules</text>
        <text x="112" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/rules · compile/test</text>

        <rect x="252" y="172" width="136" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="320" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Live feed</text>
        <text x="320" y="222" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/dashboard · live</text>

        <rect x="460" y="188" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="520" y="210" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receipt</text>
        <text x="520" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/transactions · why</text>

        <rect x="604" y="188" width="64" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="636" y="210" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Brake</text>
        <text x="636" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">revoke</text>

        <rect x="460" y="364" width="136" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="528" y="386" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Square Up</text>
        <text x="528" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/ledger · breaks: 0</text>

        <rect x="740" y="76" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="820" y="98" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/nod</text>
        <text x="820" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">approve · deny</text>

        <!-- Legend -->
        <line x1="24" y1="464" x2="936" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="24" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="24" y="492" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="44" y="500" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Screen</text>
        <rect x="104" y="492" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="124" y="500" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Home (where the owner lives)</text>
        <line x1="272" y1="498" x2="300" y2="498" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="308" y="500" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Navigation</text>
        <line x1="380" y1="498" x2="408" y2="498" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="416" y="500" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Only when needed</text>
        <text x="540" y="500" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Dashed = not built yet. The demo shop lives in the console at /shop.</text>
      </svg>
    </div>
  </div>
</body>
</html>
